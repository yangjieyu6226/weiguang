<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>微光 · 交互原型</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --cyan: #00e5ff;
  --purple: #7c4dff;
  --green: #00e5a0;
  --bg: #080816;
  --card-bg: rgba(255,255,255,0.05);
  --glass-border: rgba(255,255,255,0.10);
  --text: #ffffff;
  --text-dim: rgba(255,255,255,0.45);
}

body {
  background: radial-gradient(ellipse at 20% 30%, #0d0a2a 0%, #060610 50%, #030308 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  overflow: hidden;
}

/* ── Phone background canvas ── */
#stars { position: absolute; inset: 0; pointer-events: none; z-index: 0; }

/* ── Phone shell ── */
.phone {
  position: relative;
  width: 390px;
  height: 844px;
  background: var(--bg);
  border-radius: 52px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.06),
    0 0 60px rgba(80,50,200,0.18),
    0 0 120px rgba(0,200,255,0.08),
    0 40px 80px rgba(0,0,0,0.7);
  z-index: 1;
}

/* ── Pages ── */
.page {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
  overflow: hidden;
}
.page.active { opacity: 1; pointer-events: all; }

/* ─────────────────────────────────────────
   PAGE 1 · 意念投射
───────────────────────────────────────── */
#p1 { background: radial-gradient(ellipse at 50% 38%, #1a0f3a 0%, #0a0820 60%, var(--bg) 100%); }

/* Header */
.hdr {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 58px 26px 0;
}
.logo { font-size: 18px; font-weight: 500; color: #fff; letter-spacing: 3px; }
.dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px rgba(0,229,160,0.9);
  animation: breathe-dot 2.8s ease-in-out infinite;
}
@keyframes breathe-dot {
  0%,100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(1.5); opacity: 0.6; }
}

/* Lotus area */
.lotus-wrap {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 280px;
  margin-top: 24px;
}
.ripples {
  position: absolute;
  width: 100%; height: 100%;
  display: flex; justify-content: center; align-items: center;
  pointer-events: none;
}
.rpl {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(120,100,255,0.35);
  animation: rpl-go 4.5s ease-out infinite;
}
.rpl:nth-child(1) { animation-delay: 0s; }
.rpl:nth-child(2) { animation-delay: 1.1s; }
.rpl:nth-child(3) { animation-delay: 2.2s; }
.rpl:nth-child(4) { animation-delay: 3.3s; }
@keyframes rpl-go {
  0%   { width: 80px; height: 80px; opacity: 0.9; border-color: rgba(100,150,255,0.6); }
  100% { width: 290px; height: 290px; opacity: 0; border-color: rgba(100,150,255,0); }
}

#lotus-svg {
  position: relative; z-index: 2;
  filter:
    drop-shadow(0 0 18px rgba(120,80,255,0.9))
    drop-shadow(0 0 36px rgba(0,200,255,0.5))
    drop-shadow(0 0 60px rgba(80,40,200,0.3));
  animation: lotus-breathe 4s ease-in-out infinite;
  transition: filter 0.4s;
}
@keyframes lotus-breathe {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.04); }
}
.lotus-wrap:hover #lotus-svg {
  animation: lotus-breathe-hover 1.6s ease-in-out infinite;
  filter:
    drop-shadow(0 0 26px rgba(120,80,255,1))
    drop-shadow(0 0 52px rgba(0,200,255,0.7))
    drop-shadow(0 0 80px rgba(80,40,200,0.45));
}
@keyframes lotus-breathe-hover {
  0%,100% { transform: scale(1.04); }
  50%      { transform: scale(1.13); }
}
.outer-ring { animation: rot-cw  22s linear infinite; transform-origin: 120px 120px; }
.inner-ring { animation: rot-ccw 16s linear infinite; transform-origin: 120px 120px; }
@keyframes rot-cw  { to { transform: rotate(360deg);  } }
@keyframes rot-ccw { to { transform: rotate(-360deg); } }

/* Input section */
.input-sec {
  padding: 0 28px;
  margin-top: 18px;
}
.greet { font-size: 26px; font-weight: 600; color: #fff; margin-bottom: 6px; }
.hint  { font-size: 13px; color: var(--text-dim); margin-bottom: 18px; }
.inp-wrap { position: relative; margin-bottom: 26px; }
.inp {
  width: 100%;
  background: transparent;
  border: none; outline: none;
  font-size: 15px; color: rgba(255,255,255,0.8);
  padding: 10px 4px;
  font-family: inherit;
  caret-color: var(--cyan);
}
.inp::placeholder { color: rgba(255,255,255,0.28); }
.inp-line {
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, var(--purple) 30%, var(--cyan) 60%, var(--purple) 80%, transparent 100%);
  animation: line-pulse 3s ease-in-out infinite;
}
@keyframes line-pulse {
  0%,100% { box-shadow: 0 0 6px rgba(0,229,255,0.5); opacity: 0.7; }
  50%      { box-shadow: 0 0 18px rgba(0,229,255,0.9), 0 0 30px rgba(124,77,255,0.5); opacity: 1; }
}

/* Aurora button */
.aurora-btn {
  width: 100%;
  padding: 16px;
  border-radius: 50px;
  border: none;
  cursor: pointer;
  font-size: 16px;
  font-weight: 500;
  color: #fff;
  letter-spacing: 1px;
  font-family: inherit;
  background: linear-gradient(135deg, #7c4dff 0%, #00bcd4 50%, #651fff 100%);
  background-size: 200% 200%;
  animation: aurora 5s ease infinite;
  box-shadow:
    0 0 28px rgba(124,77,255,0.45),
    inset 0 0 30px rgba(255,255,255,0.08);
  transition: transform 0.25s cubic-bezier(0.34,1.3,0.64,1), box-shadow 0.25s;
}
.aurora-btn:hover  { transform: scale(1.04); box-shadow: 0 0 40px rgba(124,77,255,0.65), inset 0 0 30px rgba(255,255,255,0.1); }
.aurora-btn:active { transform: scale(0.97); }
@keyframes aurora {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ── Nav bar (shared) — matches Pencil: 261×72px container, 56×56 circular items ── */
.nav {
  position: absolute;
  bottom: 44px;
  left: 50%;
  transform: translateX(-50%);
  width: 261px;
}
.nav-pill {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 50px;
  padding: 8px 9px;
  height: 72px;
}
.nav-item {
  display: flex; flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  width: 56px;
  height: 56px;
  border-radius: 50%;        /* circular button */
  transition: all 0.3s ease;
  user-select: none;
  flex-shrink: 0;
}
.nav-item.on {
  background: rgba(108,103,255,0.22);
  box-shadow: 0 0 0 1.5px rgba(108,103,255,0.35),
              0 0 14px rgba(108,103,255,0.3);
}
.nav-item.on svg {
  filter: drop-shadow(0 0 5px #6C67FF) drop-shadow(0 0 10px rgba(108,103,255,0.8));
}
.nav-item.on .nav-lbl { color: #8B87FF; }
.nav-lbl { font-size: 10px; color: rgba(255,255,255,0.4); transition: color 0.3s; }

/* ─────────────────────────────────────────
   PAGE 2 · 仪式准备
───────────────────────────────────────── */
#p2 { background: #080816; }

.pg-hdr { padding: 58px 26px 14px; }
.pg-title { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 4px; }
.pg-sub   { font-size: 13px; color: var(--text-dim); }

/* Arc guide rings */
.p2-arc-ring {
  position: absolute; border-radius: 50%; pointer-events: none;
  width: 380px; height: 380px; left: -216px; top: 222px;
  border: 1px solid rgba(154,239,255,0.141);
}
.p2-arc-oval {
  position: absolute; border-radius: 50%; pointer-events: none;
  width: 258px; height: 317px; left: 17px; top: 174px;
  transform: rotate(-28deg);
  border: 0.5px solid rgba(130,242,255,0.15);
}

/* Arc carousel items */
.arc-item {
  position: absolute;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  user-select: none;
  will-change: left, top, width, height, opacity;
}

/* Info card */
.p2-card {
  position: absolute;
  left: 198px; top: 222px;
  width: 188px; height: 400px;
  background: rgba(217,243,255,0.078);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 24px;
  box-shadow: 0 0 26px rgba(83,71,255,0.2);
  padding: 25px 20px 20px;
  display: flex; flex-direction: column;
}
.p2-time    { font-size: 15px; font-weight: 300; color: rgba(245,251,255,0.8); margin-bottom: 12px; }
.p2-name    { font-size: 26px; font-weight: 700; color: #F5FBFF; line-height: 1.2; margin-bottom: 6px; }
.p2-tagline { font-size: 13px; color: rgba(205,228,240,0.66); margin-bottom: 18px; }
.p2-eff-lbl { font-size: 13px; color: rgba(245,251,255,0.5); margin-bottom: 6px; }
.p2-eff-body{ font-size: 14px; color: rgba(245,251,255,0.72); line-height: 1.6; flex: 1; }
.p2-btn {
  width: 100%; padding: 14px;
  border-radius: 999px; border: none; cursor: pointer;
  background: linear-gradient(90deg, #6F58FF, #455BF5);
  color: #f2f9ff; font-size: 16px; font-weight: 600;
  font-family: inherit;
  box-shadow: 0 0 20px rgba(84,230,255,0.3);
  transition: transform 0.15s;
}
.p2-btn:active { transform: scale(0.97); }

/* ─────────────────────────────────────────
   PAGE 3 · 核心仪式
───────────────────────────────────────── */
#p3 { background: #080816; }

/* Title / Timer / Subtitle */
.p3-title { position:absolute; left:28px; top:68px; font-size:24px; font-weight:700; color:#F5FBFF; }
.p3-timer {
  position:absolute; left:28px; top:120px;
  font-size:84px; font-weight:200; color:rgba(244,251,255,0.8);
  letter-spacing:2px; font-variant-numeric:tabular-nums;
}
.p3-sub { position:absolute; left:30px; top:223px; font-size:13px; color:rgba(205,228,240,0.66); }

/* Background ambient rings */
.p3-ring { position:absolute; border-radius:50%; pointer-events:none; }

/* Burner body (FjwMT) */
.p3-burner-body {
  position:absolute; left:118px; top:347px; width:146px; height:88px;
  border-radius:48px 48px 28px 28px;
  background:linear-gradient(180deg,#182634 0%,#2F3C4A 100%);
  box-shadow:0 0 30px rgba(78,235,255,0.33);
}
/* Burner cap/top (zJQPS) */
.p3-burner-cap {
  position:absolute; left:132px; top:333px; width:118px; height:54px;
  border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#778797,#2A3541);
}
/* Lit incense (FaayB) */
.p3-stick-lit {
  position:absolute; left:214px; top:270px;
  width:96px; height:5px; border-radius:3px;
  background:linear-gradient(90deg,#D29A4F,#E7D5AB);
  transform-origin:left center; transform:rotate(-18deg);
  pointer-events:none; display:none;
}
/* Ember tip (m72cF) */
.p3-ember {
  position:absolute; left:231px; top:315px; width:24px; height:24px;
  border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#FFBD7B,#FF7A00 60%,transparent);
  box-shadow:0 0 14px rgba(255,157,78,0.67);
  pointer-events:none; display:none;
  animation:ember-glow 1.8s ease-in-out infinite;
}
@keyframes ember-glow {
  0%,100%{box-shadow:0 0 10px rgba(255,157,78,0.6);}
  50%    {box-shadow:0 0 22px rgba(255,157,78,0.9);}
}
/* Smoke */
.p3-smoke { position:absolute; left:244px; top:264px; pointer-events:none; }
.smk {
  position:absolute; width:5px; height:5px; border-radius:50%;
  background:rgba(220,220,240,0.2);
  animation:smk-up 3.5s ease-out infinite;
}
.smk:nth-child(2){animation-delay:1.2s;left:5px;}
.smk:nth-child(3){animation-delay:2.4s;left:-5px;}
@keyframes smk-up{
  0%  {transform:translateY(0) scale(1); opacity:0.4;}
  100%{transform:translateY(-60px) scale(3); opacity:0;}
}

/* Music card (bgI5M) */
.p3-card {
  position:absolute; left:24px; top:422px; width:330px; height:120px;
  background:rgba(217,243,255,0.078);
  backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  border-radius:16px; border:1px solid rgba(255,255,255,0.082);
}
/* Song name (rOpzs) */
.p3-song {
  position:absolute; left:44px; top:437px;
  font-size:20px; font-weight:600; color:#F5FBFF; z-index:4;
}
/* Pause button (RpAhV) */
.p3-pause {
  position:absolute; right:48px; top:463px;
  width:54px; height:54px; border-radius:50%;
  background:rgba(255,255,255,0.063);
  border:1px solid rgba(255,255,255,0.086);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:#EFFFFF; z-index:4;
}
/* Colored waveform bars (5f7HD) — animated */
.p3-wave {
  position:absolute; left:48px; top:468px;
  display:flex; align-items:flex-end; gap:4px; z-index:4;
}
.wb {
  width:3px; border-radius:2px 2px 0 0;
  animation:wave-dance var(--dur,0.75s) ease-in-out infinite alternate;
}
@keyframes wave-dance {
  from{height:var(--min,3px);}
  to  {height:var(--h,20px);}
}
/* Progress track — 48px from each edge */
.p3-prog-track {
  position:absolute; left:48px; top:524px;
  width:294px; height:3px; border-radius:3px;
  background:rgba(255,255,255,0.1);
  z-index:4;
}
.p3-prog-fill {
  height:100%; border-radius:3px;
  background:linear-gradient(90deg,rgba(120,240,255,0.8),rgba(140,119,255,0.5));
  animation:prog-demo 10s ease-in-out infinite;
}
/* EiNV3 glow divider */
.p3-glow-div {
  position:absolute; left:18px; top:470px;
  width:354px; height:96px; border-radius:50%;
  background:linear-gradient(90deg,transparent,rgba(111,88,255,0.094),transparent);
  filter:blur(20px); pointer-events:none;
}

/* Draggable stick (MiYuF) — rests horizontally 12px below player card */
.stick {
  position:absolute; left:143px; top:554px;
  width:104px; height:5px; border-radius:3px;
  background:linear-gradient(90deg,#EADAB5,#D19F53);
  transform-origin:center center; transform:rotate(-6deg);
  cursor:grab; z-index:10; touch-action:none;
  box-shadow:0 2px 8px rgba(210,170,80,0.35);
}
.stick:active{cursor:grabbing;}
.stick.snapped{transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);}

/* Guide pulse — resting hint on the stick */
.stick-guide {
  position:absolute; left:177px; top:540px;
  width:32px; height:32px; border-radius:50%;
  pointer-events:none; z-index:9;
  background:radial-gradient(circle at 50% 50%, rgba(210,170,80,0.22) 0%, transparent 70%);
  animation:guide-pulse 1.8s ease-out infinite;
}
@keyframes guide-pulse {
  0%   { transform:scale(0.7); opacity:0.9; }
  60%  { transform:scale(1.6); opacity:0.2; }
  100% { transform:scale(1.9); opacity:0; }
}

/* Capsule glow (Vz4XH) */
.p3-cap-glow {
  position:absolute; left:44px; top:590px;
  width:290px; height:146px; border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(122,99,255,0.12),rgba(85,233,246,0.06) 48%,transparent);
  filter:blur(24px); pointer-events:none;
}
/* Capsule row (bFT1k) */
.capsules {
  position:absolute; left:23px; top:592px;
  width:344px; height:112px;
  display:flex; gap:16px; overflow-x:auto; scrollbar-width:none;
}
.capsules::-webkit-scrollbar{display:none;}
.cap {
  flex-shrink:0; width:69px; height:112px; border-radius:999px;
  background:rgba(255,255,255,0.039); border:1px solid rgba(255,255,255,0.071);
  padding:10px; display:flex; flex-direction:column; align-items:center; gap:10px;
  cursor:pointer; transition:all 0.3s;
}
.cap.on {
  background:rgba(122,99,255,0.133); border-color:rgba(157,235,255,0.267);
  box-shadow:0 0 18px rgba(85,233,246,0.333);
}
.cap-img{width:54px;height:54px;border-radius:50%;flex-shrink:0;}
.cap-lbl{font-size:13px;font-weight:500;color:#F5FBFF;text-align:center;}

/* ─────────────────────────────────────────
   PAGE 4 · 功德反馈
───────────────────────────────────────── */
#p4 { background: radial-gradient(ellipse at 40% 35%, #0f0a2a 0%, var(--bg) 60%); }

.res-hdr { padding: 58px 26px 10px; }
.res-title { font-size: 22px; font-weight: 600; color: #fff; }
.res-sub   { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

/* Card flip
   KEY: filter/backdrop-filter on preserve-3d parent destroys backface-visibility in Chrome.
   Solution: tilt + shadow go on .card-scene wrapper; .fortune-card only does the flip. */
.card-scene {
  margin: 20px 32px;
  height: 410px;
  perspective: 900px;
  transform: rotateZ(-3deg);
  filter: drop-shadow(0 24px 44px rgba(80,30,200,0.45));
  transition: transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94), filter 0.5s;
  cursor: default;
}
.card-scene:hover {
  transform: rotateZ(-1.5deg) scale(0.975) translateY(-6px);
  filter: drop-shadow(0 32px 56px rgba(80,30,200,0.55));
}
.fortune-card {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  /* NO filter, NO rotate here — they break preserve-3d */
  transition: transform 0.85s cubic-bezier(0.25,0.46,0.45,0.94);
}
.fortune-card.flipped { transform: rotateY(180deg); }

.card-face {
  position: absolute;
  inset: 0;
  border-radius: 24px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
}

/* Front */
.card-front {
  background: rgba(14,8,40,0.92);
  border: 1px solid rgba(255,255,255,0.13);
}
.card-aurora {
  position: absolute; inset: 0;
  /* Radial: bright center → saturated edges */
  background:
    radial-gradient(circle at 50% 42%,
      rgba(255,255,255,0.13) 0%,
      rgba(200,160,255,0.28) 18%,
      rgba(110,60,230,0.52) 42%,
      rgba(50,15,160,0.70) 68%,
      rgba(15,4,70,0.85)   100%);
}
.card-aurora-fx {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 25% 65%, rgba(0,200,255,0.18) 0%, transparent 55%),
    radial-gradient(ellipse at 75% 28%, rgba(150,50,255,0.15) 0%, transparent 50%);
  background-size: 200% 200%;
  animation: aurora-flow 9s ease infinite;
}
@keyframes aurora-flow {
  0%   { background-position: 0%   0%;   }
  50%  { background-position: 100% 100%; }
  100% { background-position: 0%   0%;   }
}
.glass-sheen {
  position: absolute;
  inset: 8px;
  border-radius: 18px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.10);
  pointer-events: none;
}
.card-front-body {
  position: relative; z-index: 2;
  height: 100%;
  display: flex; flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 36px 24px 24px;
}
.fortune-word {
  font-size: 52px;
  font-weight: 700;
  color: #fff;
  text-align: center;
  line-height: 1.15;
  text-shadow: 0 0 28px rgba(200,170,255,0.9), 0 0 60px rgba(140,90,255,0.5);
}
.fortune-bless {
  font-size: 14px;
  color: rgba(255,255,255,0.65);
  text-align: center;
  line-height: 1.8;
}
.flip-btn {
  opacity: 0.45;
  cursor: pointer;
  transition: opacity 0.25s, transform 0.4s;
  color: rgba(255,255,255,0.7);
}
.flip-btn:hover { opacity: 1; transform: rotate(180deg); }

/* Back */
.card-back {
  background: #080816;
  border: 1px solid rgba(255,255,255,0.09);
  transform: rotateY(180deg);
}

/* Merit frosted-glass card (297×97, no border) */
.merit-card {
  position: absolute;
  bottom: 218px;
  left: 40px;
  width: 297px;
  height: 97px;
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 16px;
  padding: 16px 20px 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.merit-label {

<script>
/* ── Navigation ── */
let curPage = 1;
const pageMap = { 1:'p1', 2:'p2', 3:'p3', 4:'p4' };

function goTo(n) {
  document.getElementById(pageMap[curPage]).classList.remove('active');
  curPage = n;
  document.getElementById(pageMap[n]).classList.add('active');
  updateDots();
  if (n === 3) document.dispatchEvent(new Event('p3-enter'));
  if (n === 4) randomizeFortune();
  if (n !== 3) stopAudio();
}

function navGo(from, to) { goTo(to); }

function updateDots() {
  document.querySelectorAll('.pdot').forEach((d,i) => {
    d.classList.toggle('on', i + 1 === curPage);
  });
}

/* ── Background: aurora bands + floating stars ── */
(function initBackground() {
  const cv = document.getElementById('stars');
  const ctx = cv.getContext('2d');
  cv.width = 390; cv.height = 844;

  // Aurora bands — wide soft diagonal ribbons of color
  const auroraLayers = [
    { r:80,  g:40,  b:200, yRatio:0.25, wRatio:0.45, speed:0.0004, phase:0.0   },
    { r:0,   g:180, b:255, yRatio:0.55, wRatio:0.35, speed:0.0003, phase:1.4   },
    { r:100, g:50,  b:220, yRatio:0.40, wRatio:0.30, speed:0.0005, phase:2.8   },
    { r:0,   g:220, b:180, yRatio:0.70, wRatio:0.28, speed:0.00025,phase:4.2   },
    { r:160, g:30,  b:255, yRatio:0.15, wRatio:0.32, speed:0.00035,phase:5.6   },
  ];

  // Stars: two tiers
  const stars = Array.from({length: 200}, () => ({
    x: Math.random() * 390,
    y: Math.random() * 844,
    r: Math.random() * 1.0 + 0.15,
    baseO: Math.random() * 0.55 + 0.08,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.012 + 0.004,
    vy: (Math.random() - 0.5) * 0.05,
  }));

  // Larger soft glow orbs
  const orbs = Array.from({length: 22}, () => ({
    x: Math.random() * 390,
    y: Math.random() * 844,
    r: Math.random() * 22 + 8,
    baseO: Math.random() * 0.12 + 0.03,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.004 + 0.0015,
    vx: (Math.random() - 0.5) * 0.10,
    vy: (Math.random() - 0.5) * 0.07,
    rgb: Math.random() < 0.4 ? '180,160,255' : Math.random() < 0.7 ? '140,200,255' : '200,240,220',
  }));

  let t = 0;
  (function draw() {
    t++;
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);

    // ── Aurora bands ──
    auroraLayers.forEach(a => {
      const wave = Math.sin(t * a.speed * 1000 + a.phase);
      const cy   = H * a.yRatio + wave * H * 0.06;
      const halfW = H * a.wRatio;
      const grad = ctx.createLinearGradient(0, cy - halfW, 0, cy + halfW);
      const peak = 0.055 + 0.03 * Math.sin(t * a.speed * 700 + a.phase + 1);
      grad.addColorStop(0,    `rgba(${a.r},${a.g},${a.b},0)`);
      grad.addColorStop(0.35, `rgba(${a.r},${a.g},${a.b},${peak * 0.4})`);
      grad.addColorStop(0.5,  `rgba(${a.r},${a.g},${a.b},${peak})`);
      grad.addColorStop(0.65, `rgba(${a.r},${a.g},${a.b},${peak * 0.4})`);
      grad.addColorStop(1,    `rgba(${a.r},${a.g},${a.b},0)`);
      // Horizontal stretch via skewed rect — use save/transform for diagonal tilt
      ctx.save();
      ctx.translate(W * 0.5, cy);
      ctx.rotate(-0.08 + wave * 0.015); // subtle tilt that breathes
      ctx.fillStyle = grad;
      ctx.fillRect(-W * 0.85, -halfW, W * 1.7, halfW * 2);
      ctx.restore();
    });

    // ── Soft glow orbs ──
    orbs.forEach(s => {
      s.x += s.vx; s.y += s.vy;
      if (s.x < -s.r*3) s.x = W + s.r;
      if (s.x > W + s.r*3) s.x = -s.r;
      if (s.y < -s.r*3) s.y = H + s.r;
      if (s.y > H + s.r*3) s.y = -s.r;
      const ao = s.baseO * (0.65 + 0.35 * Math.sin(t * s.speed * 600 + s.phase));
      const gr = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
      gr.addColorStop(0,   `rgba(${s.rgb},${ao})`);
      gr.addColorStop(0.5, `rgba(${s.rgb},${ao * 0.35})`);
      gr.addColorStop(1,   `rgba(${s.rgb},0)`);
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // ── Stars: random brighten/dim ──
    stars.forEach(s => {
      s.y += s.vy;
      if (s.y < 0) s.y = H;
      if (s.y > H) s.y = 0;
      // Occasionally spike to full brightness (twinkle)
      const twinkle = Math.sin(t * s.speed + s.phase);
      const ao = s.baseO * (0.4 + 0.6 * Math.max(0, twinkle));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);

(function buildLotus() {
  const ns = 'http://www.w3.org/2000/svg';
  const CX = 120, CY = 120;  // updated center for 240×240

  function makePetals(parentId, count, orbit, rx, ry, fillA) {
    const g = document.getElementById(parentId);
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * 360;
      const rad   = angle * Math.PI / 180;
      const cx = CX + Math.cos(rad) * orbit;
      const cy = CY + Math.sin(rad) * orbit;
      const el = document.createElementNS(ns, 'ellipse');
      el.setAttribute('cx', cx);
      el.setAttribute('cy', cy);
      el.setAttribute('rx', rx);
      el.setAttribute('ry', ry);
      el.setAttribute('fill', fillA);
      el.setAttribute('stroke', 'none');
      el.setAttribute('transform', `rotate(${angle+90},${cx},${cy})`);
      g.appendChild(el);
    }
  }
  makePetals('outer-petals', 16, 60, 10, 23, 'rgba(100,80,220,0.28)');
  makePetals('inner-petals', 16, 40,  7, 15, 'rgba(60,200,220,0.22)');

  // Outer orbit: 16 dots at radius 98, gradient fill
  function makeOrbitDots(parentId, count, radius, dotR, gradId) {
    const g = document.getElementById(parentId);
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2;
      const dx = CX + Math.cos(angle) * radius;
      const dy = CY + Math.sin(angle) * radius;
      const c = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', dx);
      c.setAttribute('cy', dy);
      c.setAttribute('r', dotR);
      c.setAttribute('fill', `url(#${gradId})`);
      // Slightly vary opacity by position for organic look
      c.setAttribute('opacity', (0.55 + 0.45 * Math.abs(Math.sin(i))).toFixed(2));
      g.appendChild(c);
    }
  }
  makeOrbitDots('orbit-outer', 16, 98, 5.5, 'dot-grad');
  makeOrbitDots('orbit-inner', 12, 76, 3.5, 'dot-grad-dim');
})();

/* ── AI canvas art ── */
(function initAICanvas() {
  const cv = document.getElementById('ai-canvas');
  const ctx = cv.getContext('2d');

  function resize() {
    // Fixed dimensions: phone 390px - 44px margins = 346px wide, card scene 430px tall
    cv.width  = 346;
    cv.height = 430;
  }

  let t = 0;
  let seed = Math.random() * 1000;
  // Current palette — can be updated externally via window.setAiPalette()
  let pal = ['#7c4dff','#00e5ff','#00e5a0','#651fff'];
  window.setAiPalette = function(newPal) {
    pal = newPal;
    seed = Math.random() * 1000; // new seed = new pattern each time
    t = 0;
  };

  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return [r,g,b];
  }

  function drawFrame() {
    t += 0.008;
    const W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);

    // Dark base
    ctx.fillStyle = '#060614';
    ctx.fillRect(0,0,W,H);

    // Aurora blobs
    const blobs = [
      { x: W*0.3 + Math.sin(t*0.7 + seed)*W*0.12, y: H*0.35 + Math.cos(t*0.5)*H*0.1,  r: W*0.55, col: pal[0], a: 0.28 },
      { x: W*0.7 + Math.cos(t*0.6 + seed)*W*0.1,  y: H*0.55 + Math.sin(t*0.8)*H*0.12, r: W*0.50, col: pal[1], a: 0.22 },
      { x: W*0.5 + Math.sin(t*0.4)*W*0.15,         y: H*0.2  + Math.cos(t*0.9)*H*0.08, r: W*0.40, col: pal[2], a: 0.18 },
      { x: W*0.2 + Math.cos(t*0.55)*W*0.08,        y: H*0.7  + Math.sin(t*0.65)*H*0.1, r: W*0.35, col: pal[3], a: 0.2  },
    ];
    blobs.forEach(b => {
      const [r,g,bl] = hexToRgb(b.col);
      const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      grad.addColorStop(0,   `rgba(${r},${g},${bl},${b.a})`);
      grad.addColorStop(0.5, `rgba(${r},${g},${bl},${b.a*0.4})`);
      grad.addColorStop(1,   `rgba(${r},${g},${bl},0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,W,H);
    });

    // Flower of life – concentric rings of circles
    const cx = W/2 + Math.sin(t*0.3)*W*0.03;
    const cy = H/2 + Math.cos(t*0.25)*H*0.04;
    const baseR = Math.min(W,H) * 0.11;
    const rings = 4;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (let ring = 0; ring < rings; ring++) {
      const count   = ring === 0 ? 1 : 6 * ring;
      const dist    = ring * baseR;
      const opacity = 0.12 - ring * 0.022;
      const strokeW = 0.8;
      for (let i = 0; i < count; i++) {
        const angle = ring === 0 ? 0 : (i / count) * Math.PI * 2 + t * 0.04 * (ring % 2 ? 1 : -1);
        const px = cx + Math.cos(angle) * dist;
        const py = cy + Math.sin(angle) * dist;
        const [r,g,b] = hexToRgb(pal[ring % pal.length]);
        ctx.strokeStyle = `rgba(${r},${g},${b},${opacity + 0.04 * Math.sin(t + ring)})`;
        ctx.lineWidth = strokeW;
        ctx.beginPath();
        ctx.arc(px, py, baseR, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    ctx.restore();

    // Mandala spokes
    ctx.save();
    ctx.globalAlpha = 0.08 + 0.03 * Math.sin(t);
    ctx.strokeStyle = pal[0];
    ctx.lineWidth = 0.6;
    const spokeR = baseR * rings * 1.1;
    for (let s = 0; s < 16; s++) {
      const a = (s / 16) * Math.PI * 2 + t * 0.02;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * spokeR, cy + Math.sin(a) * spokeR);
      ctx.stroke();
    }
    ctx.restore();

    // Center glow
    const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR * 1.2);
    const [cr,cg2,cb] = hexToRgb(pal[2]);
    cg.addColorStop(0,   `rgba(${cr},${cg2},${cb},0.55)`);
    cg.addColorStop(0.4, `rgba(${cr},${cg2},${cb},0.15)`);
    cg.addColorStop(1,   `rgba(${cr},${cg2},${cb},0)`);
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(cx, cy, baseR * 1.2, 0, Math.PI * 2);
    ctx.fill();

    // Subtle noise grain (adds texture)
    ctx.save();
    ctx.globalAlpha = 0.018;
    for (let i = 0; i < 120; i++) {
      const gx = Math.random() * W;
      const gy = Math.random() * H;
      ctx.fillStyle = '#fff';
      ctx.fillRect(gx, gy, 1, 1);
    }
    ctx.restore();

    requestAnimationFrame(drawFrame);
  }

  // Init immediately with fixed dimensions
  resize();
  drawFrame();
})();

let timerSecs = 23 * 60;
let timerInterval = null;
function startTimer() {
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    if (timerSecs <= 0) { clearInterval(timerInterval); timerInterval = null; return; }
    timerSecs--;
    const m = String(Math.floor(timerSecs / 60)).padStart(2,'0');
    const s = String(timerSecs % 60).padStart(2,'0');
    document.getElementById('timer').textContent = `${m}:${s}`;
  }, 1000);
}

/* ── Audio Engine (Web Audio API synthesized ambient sounds) ── */
let _actx = null, _stopSnd = null;
function getACtx() {
  if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
  if (_actx.state === 'suspended') _actx.resume();
  return _actx;
}
function stopAudio() { if (_stopSnd) { _stopSnd(); _stopSnd = null; } }

function pinkNoise(ctx, sec) {
  const len = ctx.sampleRate * sec, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for (let i=0;i<len;i++){const w=Math.random()*2-1;b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.9690*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.5500*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926;}
  return buf;
}
// 空山 – sparse bells
function snd0() {
  const ctx=getACtx(), m=ctx.createGain();m.gain.value=.45;m.connect(ctx.destination);
  const sc=[196,261.6,329.6,220,293.7];let alive=true;
  function bell(){if(!alive)return;const f=sc[Math.floor(Math.random()*sc.length)],o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(.1,ctx.currentTime+.08);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+7);o.connect(g);g.connect(m);o.start();o.stop(ctx.currentTime+8);setTimeout(bell,3200+Math.random()*4000);}
  bell();return()=>{alive=false;m.disconnect();}
}
// 松风 – pine wind (layered: rustling + whoosh + warm sub)
function snd1() {
  const ctx=getACtx();
  const master=ctx.createGain();master.gain.setValueAtTime(0,ctx.currentTime);
  master.gain.setTargetAtTime(.32,ctx.currentTime,.9);master.connect(ctx.destination);
  // Layer A: high-frequency rustle (filtered pink noise, 700–4k Hz)
  const sA=ctx.createBufferSource();sA.buffer=pinkNoise(ctx,4);sA.loop=true;
  const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=700;hp.Q.value=.4;
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4200;lp.Q.value=.3;
  const gA=ctx.createGain();gA.gain.value=.55;
  sA.connect(hp);hp.connect(lp);lp.connect(gA);gA.connect(master);sA.start();
  // Layer B: slow whoosh (low-pass, amplitude modulated by 0.16 Hz LFO)
  const sB=ctx.createBufferSource();sB.buffer=pinkNoise(ctx,4);sB.loop=true;
  const lp2=ctx.createBiquadFilter();lp2.type='lowpass';lp2.frequency.value=260;lp2.Q.value=.5;
  const gB=ctx.createGain();gB.gain.value=.38;
  const lfoB=ctx.createOscillator(),lgB=ctx.createGain();
  lfoB.type='sine';lfoB.frequency.value=.16;lgB.gain.value=.28;
  lfoB.connect(lgB);lgB.connect(gB.gain);lfoB.start();
  sB.connect(lp2);lp2.connect(gB);gB.connect(master);sB.start();
  // Layer C: gentle peaking mid (adds natural body, 1.2kHz)
  const sC=ctx.createBufferSource();sC.buffer=pinkNoise(ctx,4);sC.loop=true;
  const pk=ctx.createBiquadFilter();pk.type='peaking';pk.frequency.value=1200;pk.Q.value=1.2;pk.gain.value=5;
  const gC=ctx.createGain();gC.gain.value=.18;
  sC.connect(pk);pk.connect(gC);gC.connect(master);sC.start();
  // Layer D: barely-audible warm sine (174 Hz) adds subtle resonance
  const osc=ctx.createOscillator();osc.type='sine';osc.frequency.value=174;
  const gD=ctx.createGain();gD.gain.value=.035;
  osc.connect(gD);gD.connect(master);osc.start();
  return()=>{
    master.gain.setTargetAtTime(0,ctx.currentTime,.4);
    setTimeout(()=>{master.disconnect();},1200);
  };
}
// 潮生 – rising tide
function snd2() {
  const ctx=getACtx(),m=ctx.createGain();m.gain.value=.4;m.connect(ctx.destination);
  const src=ctx.createBufferSource();src.buffer=pinkNoise(ctx,8);src.loop=true;
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=360;
  const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.10;lg.gain.value=.16;
  lfo.connect(lg);lg.connect(m.gain);
  const sub=ctx.createOscillator(),sg=ctx.createGain();sub.frequency.value=65;sg.gain.value=.06;sub.connect(sg);sg.connect(m);
  src.connect(lp);lp.connect(m);src.start();lfo.start();sub.start();
  return()=>{src.stop();lfo.stop();sub.stop();m.disconnect();}
}
// 海风 – sea breeze
function snd3() {
  const ctx=getACtx(),m=ctx.createGain();m.gain.value=.38;m.connect(ctx.destination);
  const src=ctx.createBufferSource();src.buffer=pinkNoise(ctx,6);src.loop=true;
  const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=650;bp.Q.value=.7;
  const l1=ctx.createOscillator(),g1=ctx.createGain();l1.frequency.value=.18;g1.gain.value=.1;
  const l2=ctx.createOscillator(),g2=ctx.createGain();l2.frequency.value=.32;g2.gain.value=.06;
  l1.connect(g1);g1.connect(m.gain);l2.connect(g2);g2.connect(m.gain);
  src.connect(bp);bp.connect(m);src.start();l1.start();l2.start();
  return()=>{src.stop();l1.stop();l2.stop();m.disconnect();}
}
// 暮云 – dusk cloud dreamy pad
function snd4() {
  const ctx=getACtx(),m=ctx.createGain();m.gain.value=.28;m.connect(ctx.destination);
  [220,277.18,329.63,440].forEach((f,i)=>{
    const o=ctx.createOscillator(),g=ctx.createGain();g.gain.value=.07;o.type='sine';o.frequency.value=f;

    tr.connect(tg);tg.connect(g.gain);o.connect(g);g.connect(m);o.start();tr.start();
  });
  return()=>{m.disconnect();}
}

      const n = incenses.length;
      let slot = parseInt(div.dataset.idx) - arcIdx;
      if (slot < -2) slot += n;
      if (slot >  2) slot -= n;
      if (slot === 0) return; // already selected, ignore
      // Move only one step in the indicated direction
      arcIdx = slot < 0 ? (arcIdx - 1 + n) % n : (arcIdx + 1) % n;
      updateArc(true);
      arcHoverLock = true;
      setTimeout(() => { arcHoverLock = false; }, 480);
    });
    div.onclick = () => { arcIdx = i; updateArc(true); }; // keep for touch
    page.insertBefore(div, page.querySelector('.p2-card'));
  });
  updateArc(false);
})();

function updateArc(animate) {
  const n = incenses.length;
  document.querySelectorAll('#p2 .arc-item').forEach(item => {
    const i = parseInt(item.dataset.idx);
    let slot = i - arcIdx;
    if (slot < -2) slot += n;
    if (slot > 2)  slot -= n;
    const tr = animate ? 'left 0.45s cubic-bezier(0.34,1.1,0.64,1),top 0.45s cubic-bezier(0.34,1.1,0.64,1),width 0.45s ease,height 0.45s ease,opacity 0.45s ease' : 'none';
    item.style.transition = tr;
    if (slot < -2 || slot > 2) {
      item.style.opacity = '0'; item.style.pointerEvents = 'none'; return;
    }
    const s = arcSlots[slot + 2];
    item.style.left    = s.left + 'px';
    item.style.top     = s.top  + 'px';
    item.style.width   = s.size + 'px';
    item.style.height  = s.size + 'px';
    item.style.opacity = s.opacity;
    item.style.pointerEvents = 'auto';
    item.style.zIndex  = slot === 0 ? '3' : '2';
    if (slot === 0) {
      item.style.background  = 'radial-gradient(circle at 50% 50%, #BFF9FF, #55E8F5 45%, #7764FF)';
      item.style.boxShadow   = '0 0 22px rgba(96,240,255,0.63)';
      item.style.border      = 'none';
      item.style.transform   = 'rotate(0deg)';
      item.innerHTML = arcIconSVG(incenses[i].icon, '#041018', 22);
    } else {
      item.style.background  = 'rgba(255,255,255,0.051)';
      item.style.boxShadow   = 'none';
      item.style.border      = '1px solid rgba(255,255,255,0.071)';
      item.style.transform   = `rotate(${s.rot}deg)`;
      item.innerHTML = arcIconSVG(incenses[i].icon, '#D8F3F8', 18);
      // counter-rotate svg so icon stays upright
      item.querySelector('svg').style.transform = `rotate(${-s.rot}deg)`;
    }
  });
  const inc = incenses[arcIdx];
  document.getElementById('p2-name').textContent    = inc.name;
  document.getElementById('p2-tagline').textContent = inc.tagline;
  document.getElementById('p2-eff').textContent     = inc.eff;
}

(function initArcDrag() {
  const page = document.getElementById('p2');
  let startY = 0, dragging = false;
  const n = incenses.length;
  function down(y) { dragging = true; startY = y; }
  function move(y) {
    if (!dragging) return;
    const dy = y - startY;
    if (Math.abs(dy) > 28) {
      arcIdx = dy > 0 ? (arcIdx - 1 + n) % n : (arcIdx + 1) % n;
      updateArc(true); startY = y;
    }
  }
  function up() { dragging = false; }
  page.addEventListener('mousedown',  e => down(e.clientY));
  page.addEventListener('touchstart', e => down(e.touches[0].clientY), {passive:true});
  document.addEventListener('mousemove',  e => { if (dragging) move(e.clientY); });
  document.addEventListener('touchmove',  e => { if (dragging) move(e.touches[0].clientY); }, {passive:true});
  document.addEventListener('mouseup',  up);
  document.addEventListener('touchend', up);
  page.addEventListener('wheel', e => {
    if (!document.getElementById('p2').classList.contains('active')) return;
    arcIdx = e.deltaY > 0 ? (arcIdx + 1) % n : (arcIdx - 1 + n) % n;
    updateArc(true); e.preventDefault();
  }, {passive:false});
})();

/* ── Incense stick drag + vertical insertion + burn animation ── */
(function initStickDrag() {
  const stick  = document.getElementById('stick');
  const litStk = document.querySelector('.p3-stick-lit');
  const ember  = document.querySelector('.p3-ember');
  const guide  = document.getElementById('stick-guide');
  const phone  = stick.closest('.phone');

  // Original resting position (horizontal below player card)
  const ORIG_LEFT = 143, ORIG_TOP = 554;
  let curLeft = ORIG_LEFT, curTop = ORIG_TOP;
  let dragging = false, startX = 0, startY = 0;
  let inserted = false;

  // Burner center & vertical insert config
  const BURNER_CX = 191, BURNER_CY = 391;
  const INSERT_LEFT = 188.5; // horizontal center of burner minus half stick width(2.5)
  const INSERT_BOTTOM = 352; // bottom of inserted stick (inside burner cap)
  const FULL_H = 104;        // full stick height when vertical

  function pScale() {
    const r = phone.getBoundingClientRect();
    return { sx: r.width / 390, sy: r.height / 844, r };
  }

  function toPage(clientX, clientY) {
    const { sx, sy, r } = pScale();
    return { px: (clientX - r.left) / sx, py: (clientY - r.top) / sy };
  }

  function down(x, y) {
    if (inserted) return;
    dragging = true; startX = x; startY = y;
    stick.style.transition = 'none';
    if (guide) guide.style.display = 'none'; // hide guide once picked up
  }

  function move(x, y) {
    if (!dragging) return;
    const { sx, sy } = pScale();
    curLeft = ORIG_LEFT + (x - startX) / sx;
    curTop  = ORIG_TOP  + (y - startY) / sy;
    const { px, py } = toPage(x, y);
    const dist = Math.hypot(px - BURNER_CX, py - BURNER_CY);
    const tilt = Math.max(-80, Math.min(-10, -6 + (BURNER_CY - curTop) * -0.55));
    stick.style.left      = curLeft + 'px';
    stick.style.top       = curTop  + 'px';
    stick.style.transform = `rotate(${tilt}deg)`;
    stick.style.filter    = dist < 90
      ? 'drop-shadow(0 0 14px rgba(78,235,255,0.7))'
      : 'drop-shadow(0 0 6px rgba(230,190,100,0.5))';
  }

  function up(x, y) {
    if (!dragging) return; dragging = false;
    const { px, py } = toPage(x, y);
    const dist = Math.hypot(px - BURNER_CX, py - BURNER_CY);
    if (dist < 100) {
      doInsert();
    } else {
      stick.style.transition = 'all 0.5s cubic-bezier(0.34,1.56,0.64,1)';
      stick.style.left      = ORIG_LEFT + 'px';
      stick.style.top       = ORIG_TOP  + 'px';
      stick.style.transform = 'rotate(-58deg)';
      stick.style.filter    = '';
    }
  }

  function doInsert() {
    inserted = true;
    // Step 1: slide to burner area, keep diagonal
    stick.style.transition = 'all 0.4s cubic-bezier(0.25,0.46,0.45,0.94)';
    stick.style.left      = (INSERT_LEFT - 52) + 'px'; // approach from left
    stick.style.top       = (INSERT_BOTTOM - 60) + 'px';
    stick.style.transform = 'rotate(-80deg)'; // near-vertical
    stick.style.filter    = 'drop-shadow(0 0 18px rgba(78,235,255,0.8))';

    // Step 2: snap to perfect vertical
    setTimeout(() => {
      stick.style.transition = 'all 0.35s cubic-bezier(0.34,1.56,0.64,1)';
      stick.style.left      = INSERT_LEFT + 'px';
      stick.style.top       = (INSERT_BOTTOM - FULL_H) + 'px'; // = 248px
      stick.style.width     = '5px';
      stick.style.height    = FULL_H + 'px';
      stick.style.background= 'linear-gradient(180deg,#E7D5AB,#D29A4F)';
      stick.style.borderRadius = '3px 3px 0 0';
      stick.style.transform = 'none';
      stick.style.transformOrigin = 'center bottom';
      // Move ember to tip of vertical stick
      ember.style.display = 'block';
      ember.style.transition = 'all 0.35s ease';
      ember.style.left = (INSERT_LEFT - 12) + 'px';
      ember.style.top  = (INSERT_BOTTOM - FULL_H - 14) + 'px'; // above tip
    }, 420);

    // Step 3: start timer + burn animation
    setTimeout(() => {
      litStk.style.display = 'none'; // hide the static diagonal stick
      startTimer();
      burnStick();
    }, 780);
  }

  // Gradually shorten the vertical stick (burn animation)
  function burnStick() {
    const totalMs = timerSecs * 1000;
    const startTime = Date.now();
    function frame() {
      const elapsed  = Date.now() - startTime;
      const progress = Math.min(elapsed / totalMs, 1);
      const h = Math.max(4, FULL_H * (1 - progress));
      stick.style.height = h + 'px';
      stick.style.top    = (INSERT_BOTTOM - h) + 'px';
      // ember follows the tip
      ember.style.top = (INSERT_BOTTOM - h - 14) + 'px';
      if (timerSecs > 0) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  stick.addEventListener('mousedown',  e => { down(e.clientX, e.clientY); e.preventDefault(); });
  stick.addEventListener('touchstart', e => down(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  document.addEventListener('mousemove',  e => move(e.clientX, e.clientY));
  document.addEventListener('touchmove',  e => move(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  document.addEventListener('mouseup',  e => up(e.clientX, e.clientY));
  document.addEventListener('touchend', e => up(e.changedTouches[0].clientX, e.changedTouches[0].clientY));
})();
